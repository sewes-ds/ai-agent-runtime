# Install as a drop-in for the qualified upstream Telegram Agent user service.
# The exact unit name belongs in the release manifest.
[Service]
# Keep bot credentials and instance-specific Runtime dispatch values outside
# source checkouts. The file must be owned by the service user and mode 0600.
EnvironmentFile=%h/.config/ai-agent-runtime/secrets/agent_01-telegram.env
Environment=TELEGRAM_CODEX_BIN=%h/.local/bin/codex-wrapper@agent_01
Environment=CODEX_AUTO_UPDATE_ENABLED=false
KillMode=process
